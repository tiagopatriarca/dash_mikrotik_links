<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikroTik NOC Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Painel de Monitoramento de Links (NOC)</h1>
    </header>
    
    <main class="dashboard-grid" id="dashboard-grid">
        {% for router in routers %}
        <div class="card" id="card-{{ router.router_name }}">
            <div class="card-header">
                <span class="client-name">{{ router.client_name }}</span>
                <span class="router-name">{{ router.router_name }}</span>
            </div>
            
            <div class="card-body" id="body-{{ router.router_name }}">
                {% for link in router.links %}
                <div class="link-item" id="link-container-{{ router.router_name }}-{{ link.link_name }}">
                    <div class="status-indicator {% if link.status == 'UP' %}up{% else %}down{% endif %}" 
                         id="status-{{ router.router_name }}-{{ link.link_name }}">
                    </div>
                    <span class="link-name-small">{{ link.link_name }}</span>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
